# IP asli pengunjung jika request lewat Cloudflare (header CF-Connecting-IP).
# Tanpa ini, limit_req memakai IP edge Cloudflare sehingga throttling tidak per klien.
map $http_cf_connecting_ip $limit_client_ip {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Rate limiting zones — nama pakai prefix hmps_ agar tidak bentrok dengan site/default Nginx lain.
limit_req_zone $limit_client_ip zone=hmps_api:10m rate=10r/s;
limit_req_zone $limit_client_ip zone=hmps_berita_html:10m rate=5r/s;
limit_req_zone $limit_client_ip zone=hmps_site_root:10m rate=18r/s;
limit_req_zone $limit_client_ip zone=hmps_login:10m rate=1r/s;

# Koneksi paralel ke Node per IP pengunjung (CF-Connecting-IP). ANGKA KECIL = DDoS dari satu IP
# tidak membanjiri CPU (503 di Nginx, hampir tanpa beban Node). IP lain punya kuota sendiri.
limit_conn_zone $limit_client_ip zone=hmps_conn_per_ip:10m;
limit_conn_status 503;

# File statis uploads / attached — satu IP tidak memonopoli worker Nginx saat flood gambar.
limit_req_zone $limit_client_ip zone=hmps_static_upload:10m rate=50r/s;

# Lewati micro-cache bila ada cookie sesi (respons bisa berbeda per user).
map $http_cookie $hmps_skip_public_cache {
    default 0;
    ~authToken= 1;
}

# Micro-cache GET publik (buat direktori di server: /var/cache/nginx/hmps, user nginx).
proxy_cache_path /var/cache/nginx/hmps levels=1:2 keys_zone=hmps_public:20m max_size=200m inactive=2m use_temp_path=off;

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name himatif-encoder.com www.himatif-encoder.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name himatif-encoder.com www.himatif-encoder.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/himatif-encoder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/himatif-encoder.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP frame-src / script-src dikelola Node (Helmet + Settings.embedAllowedHosts).
    # Jangan set Content-Security-Policy di nginx — browser mengintersect semua CSP header,
    # sehingga allowlist embed dinamis di app tidak berlaku.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # File upload size limit (untuk file upload yang besar)
    client_max_body_size 100M;
    
    # Timeout settings untuk upload file besar (10 menit)
    client_body_timeout 600s;
    client_header_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/xml
        image/svg+xml;

    # Cache metadata file statis (uploads / attached) — kurangi I/O saat banyak request gambar.
    open_file_cache max=16384 inactive=30s;
    open_file_cache_valid 45s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # Assets files (CSS, JS, images) - HARUS DI ATAS location /
    location /assets/ {
        alias /var/www/hmps/dist/public/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }

    # Attached assets — user-uploaded content that can be overwritten
    location /attached_assets/ {
        limit_req zone=hmps_static_upload burst=100 nodelay;
        limit_conn hmps_conn_per_ip 40;
        alias /var/www/hmps/attached_assets/;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary Accept-Encoding;
    }

    # Uploads — user-uploaded content that can be overwritten
    location /uploads/ {
        limit_req zone=hmps_static_upload burst=100 nodelay;
        limit_conn hmps_conn_per_ip 40;
        alias /var/www/hmps/uploads/;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary Accept-Encoding;
    }

    # Favicon - HARUS DI ATAS location /
    location = /favicon.ico {
        alias /var/www/hmps/public/favicon.ico;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon PNG
    location = /favicon.png {
        alias /var/www/hmps/public/favicon.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Site Web Manifest
    location = /site.webmanifest {
        alias /var/www/hmps/public/site.webmanifest;
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "application/manifest+json";
    }

    # Browser Config
    location = /browserconfig.xml {
        alias /var/www/hmps/public/browserconfig.xml;
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "application/xml";
    }

    # SEO files - FIXED PATHS
    location = /robots.txt {
        alias /var/www/hmps/public/robots.txt;
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "text/plain";
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security files
    location = /.well-known/security.txt {
        alias /var/www/hmps/public/.well-known/security.txt;
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "text/plain";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Site settings & home images — micro-cache GET publik (ringankan Node/Mongo saat flood)
    location = /api/settings {
        limit_req zone=hmps_api burst=20 nodelay;
        limit_conn hmps_conn_per_ip 12;
        proxy_cache hmps_public;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 20s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_no_cache $hmps_skip_public_cache;
        proxy_cache_bypass $hmps_skip_public_cache;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/home-images/active {
        limit_req zone=hmps_api burst=20 nodelay;
        limit_conn hmps_conn_per_ip 12;
        proxy_cache hmps_public;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 20s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_no_cache $hmps_skip_public_cache;
        proxy_cache_bypass $hmps_skip_public_cache;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Daftar berita publik — cache singkat di edge (selaras TTL app ~10s); tidak meng-cache path lain /api/berita/*
    location = /api/berita {
        limit_req zone=hmps_api burst=14 nodelay;
        limit_conn hmps_conn_per_ip 12;
        proxy_cache hmps_public;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_no_cache $hmps_skip_public_cache;
        proxy_cache_bypass $hmps_skip_public_cache;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — semakin kecil = semakin banyak 503 di Nginx saat flood (Mongo tidak kejepit)
    location /api/ {
        limit_req zone=hmps_api burst=20 nodelay;
        limit_conn hmps_conn_per_ip 12;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* ^/berita(/|$) {
        limit_req zone=hmps_berita_html burst=14 nodelay;
        limit_conn hmps_conn_per_ip 10;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Main location (HARUS DI BAWAH)
    location / {
        limit_req zone=hmps_site_root burst=45 nodelay;
        limit_conn hmps_conn_per_ip 16;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Security
        proxy_hide_header X-Powered-By;
        add_header X-Served-By "HMPS-Server" always;
    }

    # Security: Hide sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
} 